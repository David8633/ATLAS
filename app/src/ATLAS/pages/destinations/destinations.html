<div class="container">
  <h2>Destinos de moda</h2>

  <!-- GRID SOLO PARA LAS TARJETAS -->
  <div class="grid-layout">
    @if (top8Destination().length > 1) {

      @for (item of top8Destination(); track item.id; let i = $index) {

        <a [routerLink]="['/lodgings']"
           [queryParams]="{ destination: item.cityName }"
           class="card-link">

          <div class="card"
               [style.backgroundImage]="'url(https://picsum.photos/seed/' + i + '/400/500)'"
               [class.large-card]="i < 2"
               [class.small-card]="i >= 2">

            <div class="card-content">
              <h3>{{ item.cityName }}</h3>
              <h4>{{ item.countryName }}</h4>
            </div>

          </div>

        </a>

      }

    }
  </div>

  @if (top8Destination().length <= 1) {
    <div class="loading-container">
      <div class="spinner"></div>
      <p>Cargando alojamiento...</p>
    </div>
  }
</div>
