<div class="opinion-card">

  <div class="card-header">

    <div class="user-info">

      <div class="user-avatar">
        {{ getUserInitial() }}
      </div>

      <div class="user-details">

        <strong class="user-name">
          {{ opinion.userName }}
        </strong>

        <span class="review-date">

          <i class="bi bi-calendar3"></i>

          {{ formatDate(opinion.publicationDate) }}

        </span>

      </div>

    </div>

    <div class="rating-section">

      <div class="stars">

        @for (star of stars; track star) {

          <i
            class="bi"
            [class.bi-star-fill]="star <= opinion.rating"
            [class.bi-star]="star > opinion.rating">
          </i>

        }

      </div>

      <span class="rating-number">

        {{ opinion.rating }}.0

      </span>

    </div>

  </div>

  <div class="card-body">

    <p class="comment-text">
      {{ opinion.comments }}
    </p>

  </div>

</div>
