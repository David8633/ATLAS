<div class="opinions-section">

  <!-- HEADER -->
  <div class="section-header">
    <h3>
      <i class="bi bi-chat-dots-fill"></i>
      Opiniones
    </h3>
  </div>

  <!-- LOADING -->
  @if (opinionService.isLoading()) {

    <div class="loading">
      Cargando opiniones...
    </div>

  }

  <!-- EMPTY -->
  @else if (opinionService.opinions().length === 0) {

    <div class="empty-state">

      <i class="bi bi-chat-dots"></i>

      <p>
        Todavía no hay opiniones.
      </p>

    </div>

  }

  <!-- LIST -->
  @else {

    <div class="opinions-list">

      @for (op of opinionService.opinions(); track op.id) {

        <app-opinion-card
          [opinion]="op">
        </app-opinion-card>

      }

    </div>

    <!-- PAGINACIÓN -->
    <div class="pagination">

      <button
        (click)="prevPage()"
        [disabled]="opinionService.currentPage() === 0">

        Anterior

      </button>

      <span>

        {{ opinionService.currentPage() + 1 }}
        /
        {{ opinionService.totalPages() }}

      </span>

      <button
        (click)="nextPage()"
        [disabled]="opinionService.currentPage() + 1 >= opinionService.totalPages()">

        Siguiente

      </button>

    </div>

  }

</div>
