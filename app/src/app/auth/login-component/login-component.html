<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Login Futurista</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="glass-box">
      <h2>LOGIN</h2>
      <form>
        <div class="input-group-custom">
          <i class="bi bi-person"></i>
          <input type="text" placeholder="Usuario" required />
        </div>

        <div class="input-group-custom">
          <i class="bi bi-lock"></i>
          <input type="password" placeholder="Contraseña" required />
        </div>
        <p>¿Todavia no tienes cuenta?<a routerLink="/auth/register">¡REGISTRATE!</a></p>
        <div class="button-group">
          <button type="submit" class="btn-acceder">ACCEDER</button>
          <button type="button" routerLink="/dashboard" class="btn-volver">
            <i class="bi bi-arrow-left"></i> VOLVER
          </button>
        </div>
      </form>
    </div>
  </body>
</html>
