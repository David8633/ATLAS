<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Login</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="glass-box">
      <h2>LOGIN</h2>
      <form [formGroup]="myForm">
        <div class="input-group-custom" [class.invalid]="isInvalidField('username')" >
          <i class="bi bi-person"></i>
          <input type="text" id="username" placeholder="Usuario" formControlName="username" />
            @if(isInvalidField('username')){
                    <small>{{getError('username')}}</small>
                }
        </div>

        <div class="input-group-custom" [class.invalid]="isInvalidField('password')">
          <i class="bi bi-lock"></i>
          <input type="password" id="password" placeholder="Contraseña" formControlName="password" />
            @if(isInvalidField('password')){
                    <small class="">{{getError('password')}}</small>
                }
        </div>
        <p>¿Todavia no tienes cuenta?<a routerLink="/auth/register">¡REGISTRATE!</a></p>
        <div class="button-group">
          <button type="submit" class="btn-acceder">ACCEDER</button>
          <button type="button" routerLink="/dashboard" class="btn-volver">
            <i class="bi bi-arrow-left"></i> VOLVER
          </button>
        </div>
      </form>
    </div>
  </body>
</html>
