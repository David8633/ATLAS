<section class="account-settings">

    <!-- Panel izquierdo: nickname -->
    <div class="panel">
        <div class="avatar"></div>

        <h3>USERNAME -> nickame2</h3>
        <input type="text" placeholder="Tu nickname actual">

        <h3>PASSWORD</h3>
        <input type="password" placeholder="Tu contraseña">

        <button class="btn-primary">EDIT NICKNAME</button>
    </div>

    <!-- Panel derecho: cambiar email -->
    <div class="panel">
        <h2>CAMBIAR EMAIL</h2>

        <label>NEW EMAIL</label>
        <input type="email" placeholder="Nuevo email">

        <label>PASSWORD</label>
        <input type="password" placeholder="Contraseña">

        <label>RETRY PASSWORD</label>
        <input type="password" placeholder="Repite la contraseña">

        <button class="btn-primary">SAVE CHANGE</button>
    </div>

    <div class="panel">
        <h2>CAMBIAR PASSWORD</h2>

        <label>NEW PASSWORD</label>
        <input type="newPassword" placeholder="Nuevo email">

        <label>PASSWORD</label>
        <input type="password" placeholder="Contraseña">

        <label>RETRY PASSWORD</label>
        <input type="password" placeholder="Repite la contraseña">

        <button class="btn-primary">SAVE CHANGE</button>
    </div>

</section>
