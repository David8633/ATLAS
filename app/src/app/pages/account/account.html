<header class="account-header">
  <div class="user-info">
    <div class="mini-avatar"></div>
    <span>Sesión iniciada como <strong>nickame2</strong></span>
  </div>

  <div class="session-actions">
    <button class="btn-logout-horizontal">
      <svg
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
        <polyline points="16 17 21 12 16 7"></polyline>
        <line x1="21" y1="12" x2="9" y2="12"></line>
      </svg>
      CERRAR SESIÓN
    </button>
  </div>
</header>

<section class="account-settings">
  <!-- Panel izquierdo: nickname -->
  <div class="panel">
    <div class="avatar"></div>

    <h3>USERNAME -> nickame2</h3>
    <input type="text" placeholder="Tu nickname actual" />

    <h3>PASSWORD</h3>
    <div class="password-wrapper">
      <input type="password" placeholder="Tu contraseña" id="passwordInput" />

     <button><i class="bi bi-eye-slash toggle-password" id="togglePassword">
      </i></button>
    </div>

    <button class="btn-primary">EDIT NICKNAME</button>
  </div>

  <!-- Panel derecho: cambiar email -->
  <div class="panel">
    <h2>CAMBIAR EMAIL</h2>

    <label>NEW EMAIL</label>
    <input type="email" placeholder="Nuevo email" />

    <label>PASSWORD</label>
    <input type="password" placeholder="Contraseña" />

    <label>RETRY PASSWORD</label>
    <input type="password" placeholder="Repite la contraseña" />

    <button class="btn-primary">SAVE CHANGE</button>
  </div>

  <div class="panel">
    <h2>CAMBIAR PASSWORD</h2>

    <label>NEW PASSWORD</label>
    <input type="newPassword" placeholder="Nuevo email" />

    <label>PASSWORD</label>
    <input type="password" placeholder="Contraseña" />

    <label>RETRY PASSWORD</label>
    <input type="password" placeholder="Repite la contraseña" />

    <button class="btn-primary">SAVE CHANGE</button>
  </div>
</section>
