<section class="hero-search" aria-label="Buscador de viajes">
    <div class="search-bg-image" aria-hidden="true"></div>
    <div class="container relative-content">
        <form class="search-bar-premium" role="search">
            <div class="search-group">
                <div class="category-select-wrapper">
                    <label for="accommodation-type" class="sr-only">Tipo de alojamiento</label>
                    <i class="bi bi-houses-fill select-icon" aria-hidden="true"></i>
                    <select id="accommodation-type" class="select-category-premium">
                        <option value="apartamento">Apartamento</option>
                        <option value="motel">Motel</option>
                        <option value="apartahotel">Apartahotel</option>
                        <option value="piso">Piso</option>
                    </select>
                </div>
                <div class="divider" aria-hidden="true"></div>
                <div class="search-input-wrapper">
                    <label for="main-search" class="sr-only">¿A dónde quieres ir en Andalucía?</label>
                    <i class="bi bi-search search-icon-inner" aria-hidden="true"></i>
                    <input type="text" id="main-search" placeholder="¿A dónde quieres ir en Andalucía?"
                        autocomplete="off">
                </div>
            </div>
            <button type="submit" class="btn-execute-search" aria-label="Buscar ahora">
                <i class="bi bi-arrow-right-short" aria-hidden="true"></i>
            </button>
        </form>
    </div>
</section>
